[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "review-dashboard"
version = "0.1.0"
description = "Human-in-the-loop review dashboard for sourced topics and rendered videos."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Pinch" }]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.29.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.1",
    "rapidfuzz>=3.9.3",
]

[project.scripts]
review-dashboard = "review_dashboard.app:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["review_dashboard*"]
